---
name: Build SerialPortConnector

'on':
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtserialport'
          tools: 'tools_mingw90'
          cache: true

      - name: Build
        shell: cmd
        run: |
          set PATH=%IQTA_TOOLS%\mingw1120_64\bin;%PATH%
          mkdir build
          cd build
          qmake ..\SerialPortConnector.pro CONFIG+=release
          mingw32-make -j4

      - name: Deploy
        shell: cmd
        run: |
          mkdir deploy
          copy build\release\SerialPortConnector.exe deploy\
          set PATH=%IQTA_TOOLS%\mingw1120_64\bin;%PATH%
          windeployqt --release deploy\SerialPortConnector.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialPortConnector-Windows
          path: deploy/

  build-linux:
    runs-on: ubuntu-22.04  # Use 22.04 for glibc 2.35 compatibility

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpulse-dev \
            libudev-dev \
            fuse \
            libfuse2 \
            file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtserialport'
          cache: true

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../SerialPortConnector.pro CONFIG+=release
          make -j$(nproc)

      - name: Download linuxdeploy
        run: |
          release=https://github.com/linuxdeploy
          suffix=/releases/download/continuous
          app=linuxdeploy
          plugin=linuxdeploy-plugin-qt
          wget -q "$release/$app$suffix/$app-x86_64.AppImage"
          wget -q "$release/$plugin$suffix/$plugin-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

      - name: Create AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          # Set up environment
          export LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH
          export PATH=$QT_ROOT_DIR/bin:$PATH

          # Create AppDir structure
          icon_dir=AppDir/usr/share/icons/hicolor/256x256/apps
          desktop_file=AppDir/usr/share/applications/SerialPortConnector.desktop
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p "$icon_dir"

          # Copy executable
          cp build/SerialPortConnector AppDir/usr/bin/

          # Create .desktop file
          cat > "$desktop_file" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=SerialPortConnector
          Exec=SerialPortConnector
          Icon=SerialPortConnector
          Categories=Utility;
          EOF

          # Use the AM32 logo as the AppImage icon
          cp assets/am32-icon-256.png "$icon_dir/SerialPortConnector.png"

          # Extract linuxdeploy tools (avoids FUSE issues in CI)
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-plugin-qt

          # Run linuxdeploy with Qt plugin
          export PATH="$(pwd)/linuxdeploy-plugin-qt/usr/bin:$PATH"
          ./linuxdeploy/AppRun \
            --appdir AppDir \
            --executable build/SerialPortConnector \
            --desktop-file "$desktop_file" \
            --plugin qt \
            --output appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialPortConnector-Linux
          path: SerialPortConnector*.AppImage

  build-macos-arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtserialport'
          cache: true

      - name: Build arm64 app
        run: |
          mkdir build-arm64 && cd build-arm64
          qmake ../SerialPortConnector.pro CONFIG+=release \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 \
            'QMAKE_CXXFLAGS+=-include arm_acle.h'
          make -j$(sysctl -n hw.ncpu)
          plist=SerialPortConnector.app/Contents/Info.plist
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleIconFile am32-app-icon.icns' "$plist"
          /usr/libexec/PlistBuddy \
            -c 'Add :CFBundleShortVersionString string 1.97.1' "$plist"
          /usr/libexec/PlistBuddy \
            -c 'Add :CFBundleVersion string 1.97.1' "$plist"
          lipo SerialPortConnector.app/Contents/MacOS/SerialPortConnector \
            -verify_arch arm64

      - name: Deploy
        run: |
          cd build-arm64
          macdeployqt SerialPortConnector.app
          codesign --force --deep --sign - SerialPortConnector.app
          codesign --verify --deep --strict SerialPortConnector.app
          hdiutil create -volname SerialPortConnector \
            -srcfolder SerialPortConnector.app \
            -ov -format UDZO SerialPortConnector.dmg
          mv SerialPortConnector.dmg ../SerialPortConnector-macOS-arm64.dmg

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialPortConnector-macOS-arm64
          path: SerialPortConnector-macOS-arm64.dmg

  build-macos-universal:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtserialport'
          cache: true

      - name: Build universal app
        run: |
          mkdir build-arm64 build-x86_64
          cd build-arm64
          qmake ../../SerialPortConnector.pro CONFIG+=release \
            QMAKE_APPLE_DEVICE_ARCHS=arm64 \
            'QMAKE_CXXFLAGS+=-include arm_acle.h'
          make -j$(sysctl -n hw.ncpu)
          cd ../build-x86_64
          qmake ../../SerialPortConnector.pro CONFIG+=release \
            QMAKE_APPLE_DEVICE_ARCHS=x86_64
          make -j$(sysctl -n hw.ncpu)
          cd ..
          arm_app=build-arm64/SerialPortConnector.app
          x86_app=build-x86_64/SerialPortConnector.app
          universal_app=build-universal/SerialPortConnector.app
          plist=$arm_app/Contents/Info.plist
          /usr/libexec/PlistBuddy \
            -c 'Set :CFBundleIconFile am32-app-icon.icns' "$plist"
          /usr/libexec/PlistBuddy \
            -c 'Add :CFBundleShortVersionString string 1.97.1' "$plist"
          /usr/libexec/PlistBuddy \
            -c 'Add :CFBundleVersion string 1.97.1' "$plist"
          mkdir build-universal
          ditto "$arm_app" "$universal_app"
          lipo -create \
            "$arm_app/Contents/MacOS/SerialPortConnector" \
            "$x86_app/Contents/MacOS/SerialPortConnector" \
            -output "$universal_app/Contents/MacOS/SerialPortConnector.new"
          mv "$universal_app/Contents/MacOS/SerialPortConnector.new" \
            "$universal_app/Contents/MacOS/SerialPortConnector"
          lipo "$universal_app/Contents/MacOS/SerialPortConnector" \
            -verify_arch arm64 x86_64

      - name: Deploy
        run: |
          cd build-universal
          macdeployqt SerialPortConnector.app
          codesign --force --deep --sign - SerialPortConnector.app
          codesign --verify --deep --strict SerialPortConnector.app
          hdiutil create -volname SerialPortConnector \
            -srcfolder SerialPortConnector.app \
            -ov -format UDZO SerialPortConnector.dmg
          mv SerialPortConnector.dmg ../SerialPortConnector-macOS-universal.dmg

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialPortConnector-macOS-universal
          path: SerialPortConnector-macOS-universal.dmg

  create-release:
    needs:
      - build-windows
      - build-linux
      - build-macos-arm64
      - build-macos-universal
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package Windows artifact
        run: |
          cd SerialPortConnector-Windows
          zip -r ../SerialPortConnector-Windows.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AM32 Offline Configurator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SerialPortConnector-Windows.zip
            SerialPortConnector-Linux/*.AppImage
            SerialPortConnector-macOS-arm64/*.dmg
            SerialPortConnector-macOS-universal/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
